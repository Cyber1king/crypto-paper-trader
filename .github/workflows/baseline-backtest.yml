
name: Baseline Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: research_engine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run baseline BTCUSDT backtest
        run: |
          python - <<'PY'
          from crypto_paper_lab.data import load_ohlcv_csv
          from crypto_paper_lab.dataset import validate_dataset
          from crypto_paper_lab.backtest import run_backtest
          from crypto_paper_lab.report import create_report
          from crypto_paper_lab.strategy import StrategyConfig
          from crypto_paper_lab.analysis import (
              analyze_trade_directions,
              analyze_trade_signals,
          )

          path = "data/BTCUSDT_1h_Cleaned (1).csv"

          candles = load_ohlcv_csv(path)
          validate_dataset(candles)

          config = StrategyConfig(
              asset="BTC/USDT",
              timeframe="1h",
              lookback=20,
              fast_period=5,
              slow_period=12,
              breakout_buffer=0.001,
              retest_tolerance=0.002,
          )

          result = run_backtest(
              candles,
              config=config,
              starting_balance=10_000.0,
              risk_fraction=0.01,
          )

          report = create_report(result)
          directions = analyze_trade_directions(result.trades)
          signals = analyze_trade_signals(result.trades)

          print("")
          print("===== BASELINE BACKTEST =====")
          print(f"Candles: {len(candles)}")
          print(f"Start: {candles[0].timestamp}")
          print(f"End: {candles[-1].timestamp}")
          print(f"Trades: {report['trades']}")
          print(f"Net P&L: {report['net_pnl']:.2f}")
          print(f"Win Rate: {report['win_rate']:.2%}")
          print(f"Profit Factor: {report['profit_factor']:.4f}")
          print(f"Average P&L: {report['average_pnl']:.2f}")
          print(f"Max Drawdown: {report['max_drawdown']:.2%}")
          print(f"Ending Balance: {report['ending_balance']:.2f}")

          print("")
          print("===== LONG VS SHORT =====")

          for side, stats in directions.items():
              print("")
              print(f"===== {side.upper()} =====")
              print(f"Trades: {stats['trades']}")
              print(f"Net P&L: {stats['net_pnl']:.2f}")
              print(f"Win Rate: {stats['win_rate']:.2%}")
              print(f"Profit Factor: {stats['profit_factor']:.4f}")
              print(f"Average P&L: {stats['average_pnl']:.2f}")

          print("")
          print("===== BREAKOUT VS RETEST =====")

          for name, stats in signals.items():
              print("")
              print(f"===== {name.upper()} =====")
              print(f"Trades: {stats['trades']}")
              print(f"Net P&L: {stats['net_pnl']:.2f}")
              print(f"Win Rate: {stats['win_rate']:.2%}")
              print(f"Profit Factor: {stats['profit_factor']:.4f}")
              print(f"Average P&L: {stats['average_pnl']:.2f}")

          print("")
          print("==========================")
          PY
